name: Validation

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    pr-title:
        name: Conventional pull request title
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    formatting:
        name: Repository formatting
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
            - run: npm ci
            - run: npm run format:check

    security-audit:
        name: Dependency audit — ${{ matrix.directory }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        strategy:
            fail-fast: false
            matrix:
                directory:
                    - .
                    - dash
                    - site
                    - extensions/memory
                    - extensions/search
                    - extensions/tasks
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
            - run: npm audit --prefix "${{ matrix.directory }}" --audit-level=high

    core:
        name: Core build and tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run build:src
            - run: npm run test:coverage

    extensions:
        name: Extension — ${{ matrix.extension }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                extension: [memory, search, tasks]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
                  cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
            - run: npm ci --prefix "extensions/${{ matrix.extension }}"
            - run: npm run build --prefix "extensions/${{ matrix.extension }}"
            - run: npm test --if-present --prefix "extensions/${{ matrix.extension }}"

    dashboard:
        name: Dashboard type and production build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
                  cache-dependency-path: dash/package-lock.json
            - run: npm ci --prefix dash
            - run: npm run dashboard:lint
            - run: npm run dashboard:typecheck
            - run: npm run dashboard:test
            - run: npm run dashboard:build

    documentation:
        name: Documentation production build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
                  cache-dependency-path: site/package-lock.json
            - run: npm ci --prefix site
            - run: npm run docs:check
            - run: npm run docs:build

    package-smoke:
        name: npm package smoke check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [core, extensions, dashboard]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
            - run: npm ci
            - run: npm run ci:extensions
            - run: npm run build
            - run: npm run test:canary
            - run: npm pack --dry-run --ignore-scripts
